# The Azure Service Bus emulator for the transport tests (test/FxMap.Tests/TransportTests/ServiceBusTransportTests.cs).
#
#   docker compose -f test/servicebus-emulator/docker-compose.yml up -d
#   export FXMAP_TEST_SERVICEBUS="Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"   # add :PORT to the endpoint if SB_AMQP_PORT is not 5672 (CI uses 5673: RabbitMQ has 5672)
#
# The emulator has no management API: the queues the transport uses are declared in Config.json (a request queue and a reply
# queue, both requiring sessions (the owner and the client use session processors), for each of the prefixes sbtest1..sbtest6: one prefix for each test).
# On an ARM machine SQL Server does not run: SQL_IMAGE=mcr.microsoft.com/azure-sql-edge:latest
name: fxmap-servicebus-test

services:
  sqlserver:
    image: ${SQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FxMap-Test-Passw0rd"
    networks: [sb]

  emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on: [sqlserver]
    volumes:
      - ./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "${SB_AMQP_PORT:-5672}:5672"
      - "${SB_HEALTH_PORT:-5300}:5300"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: "FxMap-Test-Passw0rd"
    networks: [sb]

networks:
  sb:
