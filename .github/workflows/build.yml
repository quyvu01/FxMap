# This workflow will build and publish all FxMap ecosystem packages when the version changes.

name: Build FxMap and Publish
env:
  VERSION: 4.1.5

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: 'build fxmap project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
  
  testing:
    needs: build
    name: "Run Unit and Integration Tests"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dotnet-version: '8.0.x'
            framework: 'net8.0'
          - dotnet-version: '9.0.x'
            framework: 'net9.0'
          - dotnet-version: '10.0.x'
            framework: 'net10.0'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Unit Tests
        run: dotnet test test/FxMap.Tests/FxMap.Tests.csproj -c Release --framework ${{ matrix.framework }} --filter "FullyQualifiedName~FxMap.Tests.UnitTests" --logger "console;verbosity=normal"

      - name: Run Contract Tests
        run: dotnet test test/FxMap.Tests/FxMap.Tests.csproj -c Release --framework ${{ matrix.framework }} --filter "FullyQualifiedName~FxMap.Tests.ContractTests" --logger "console;verbosity=normal"

      - name: Run Integration Tests (EF Core)
        run: dotnet test test/FxMap.Tests/FxMap.Tests.csproj -c Release --framework ${{ matrix.framework }} --filter "FullyQualifiedName~FxMap.Tests.IntegrationTests.EfCore" --logger "console;verbosity=normal"

      - name: Run Integration Tests (Expressions)
        run: dotnet test test/FxMap.Tests/FxMap.Tests.csproj -c Release --framework ${{ matrix.framework }} --filter "FullyQualifiedName~FxMap.Tests.IntegrationTests.Expressions" --logger "console;verbosity=normal"

      - name: Run Analyzer Tests
        run: dotnet test test/FxMap.Analyzers.Tests/FxMap.Analyzers.Tests.csproj -c Release --framework ${{ matrix.framework }} --logger "console;verbosity=normal"

  # The data providers against real databases (service containers). The tests are skipped when a connection string
  # is not set (FXMAP_TEST_MONGO / FXMAP_TEST_POSTGRES), so the other jobs and a plain `dotnet test` stay green without them.
  provider-tests:
    needs: build
    name: "Run Provider Tests (MongoDB, PostgreSQL)"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dotnet-version: '8.0.x'
            framework: 'net8.0'
          - dotnet-version: '9.0.x'
            framework: 'net9.0'
          - dotnet-version: '10.0.x'
            framework: 'net10.0'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FXMAP_TEST_POSTGRES: "Host=localhost;Username=postgres;Password=postgres"
      FXMAP_TEST_MONGO: "mongodb://localhost:27017"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ matrix.dotnet-version }}
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Provider Tests
        run: dotnet test test/FxMap.Tests/FxMap.Tests.csproj -c Release --framework ${{ matrix.framework }} --filter "FullyQualifiedName~FxMap.Tests.ProviderTests" --logger "console;verbosity=normal"

  # The transports between two services (NATS, RabbitMQ, SQS on LocalStack, gRPC in process). The owner and the consumer
  # are two containers of dependency injection in the test process; the messages go through the real broker.
  transport-tests:
    needs: build
    name: "Run Transport Tests (gRPC, NATS, RabbitMQ, SQS, Kafka, Service Bus)"
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dotnet-version: '8.0.x'
            framework: 'net8.0'
          - dotnet-version: '9.0.x'
            framework: 'net9.0'
          - dotnet-version: '10.0.x'
            framework: 'net10.0'
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      kafka:
        image: apache/kafka:latest
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    env:
      FXMAP_TEST_NATS: "nats://localhost:4222"
      FXMAP_TEST_RABBITMQ: "localhost"
      FXMAP_TEST_SQS: "http://localhost:4566"
      FXMAP_TEST_KAFKA: "localhost:9092"
      # The emulator listens on 5673 because RabbitMQ has 5672
      FXMAP_TEST_SERVICEBUS: "Endpoint=sb://localhost:5673;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # The nats image has no shell, so a service container cannot have a health check: start it here and wait for the port.
      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 nats:2
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/4222) 2>/dev/null && exit 0
            sleep 1
          done
          echo "NATS did not start" && docker logs nats && exit 1

      # The Service Bus emulator needs SQL Server (heavy), so it is started with compose and waited for on its health port.
      - name: Start the Service Bus emulator
        env:
          SB_AMQP_PORT: 5673
        run: |
          docker compose -f test/servicebus-emulator/docker-compose.yml up -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:5300/health && exit 0
            sleep 5
          done
          echo "The emulator did not become healthy"
          docker compose -f test/servicebus-emulator/docker-compose.yml logs
          exit 1

      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ matrix.dotnet-version }}
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Transport Tests
        run: dotnet test test/FxMap.Tests/FxMap.Tests.csproj -c Release --framework ${{ matrix.framework }} --filter "FullyQualifiedName~FxMap.Tests.TransportTests" --logger "console;verbosity=normal"

      - name: Emulator logs
        if: failure()
        run: docker compose -f test/servicebus-emulator/docker-compose.yml logs

  calc-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs:
      - build
      - testing
      - provider-tests
      - transport-tests
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref }}" = 'refs/heads/main' ]; then
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=${VERSION}-develop.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi
  
  publish:
    name: Build and Publish NuGets
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && success()
    needs:
      - calc-version
    steps:
      - name: Version Output Check
        run: echo "Publishing version ${{ needs.calc-version.outputs.version }}"

      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build All Projects
        run: dotnet build -c Release -p:Version=${{ needs.calc-version.outputs.version }}

      - name: Pack All Projects
        run: |
          dotnet pack --no-build -c Release -p:PackageVersion=${{ needs.calc-version.outputs.version }} -o ./artifacts

      - name: List Packed Files
        run: ls -al ./artifacts

      - name: Publish NuGets
        working-directory: artifacts
        run: |
          for file in *.nupkg; do
            if [[ "$file" =~ ^(FxMap|FxMap\.(Analyzers|EntityFrameworkCore|MongoDb|HotChocolate|Aws\.Sqs|Azure\.ServiceBus|Grpc|gRPC|Kafka|Nats|RabbitMq))\.[0-9] ]]; then
              echo "Pushing $file"
              dotnet nuget push "$file" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate --no-symbols
            else
              echo "Skipping $file (not in allowed list)"
            fi
          done