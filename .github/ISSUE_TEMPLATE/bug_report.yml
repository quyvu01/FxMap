name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: FxMap version
      description: All FxMap.* packages must use the same version.
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET version
      placeholder: ".NET 9"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [gRPC, NATS, RabbitMQ, Kafka, Azure Service Bus, Amazon SQS, Other / not sure]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Data provider
      options: [Entity Framework Core, MongoDB, Other / not sure]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The profile, the entity config and the registration (AddFxMap) are usually enough.
      render: csharp
